<main class="password-page">
  <section class="password-card">
    <div class="card-header">
      <span>Seguridad</span>
      <h1>Actualiza tu contrasena</h1>
      <p>Tu cuenta tiene una contrasena temporal. Debes crear una nueva antes de continuar.</p>
    </div>

    <form class="password-form" (ngSubmit)="cambiarPassword()">
      <label>
        Contrasena temporal o actual
        <input type="password" [(ngModel)]="passwordActual" name="passwordActual" required />
      </label>

      <label>
        Nueva contrasena
        <input type="password" [(ngModel)]="nuevaPassword" name="nuevaPassword" required minlength="8" />
      </label>

      <label>
        Confirmar nueva contrasena
        <input type="password" [(ngModel)]="confirmarPassword" name="confirmarPassword" required minlength="8" />
      </label>

      <p *ngIf="error" class="message error">{{ error }}</p>

      <div class="actions">
        <button type="button" class="secondary-button" (click)="cerrarSesion()" [disabled]="loading">
          Cerrar sesion
        </button>
        <button type="submit" class="primary-button" [disabled]="loading">
          {{ loading ? 'Actualizando...' : 'Cambiar contrasena' }}
        </button>
      </div>
    </form>
  </section>
</main>
