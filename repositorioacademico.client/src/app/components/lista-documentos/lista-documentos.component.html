<section class="repositorio-card">
  <div class="repositorio-toolbar">
    <div class="search-box">
      <input type="text"
             [(ngModel)]="filtro"
             placeholder="Filtrar por titulo, autor, facultad, tipo o estado..." />
    </div>

    <button type="button" class="refresh-button" (click)="cargarDocumentos()" [disabled]="cargando">
      {{ cargando ? 'Actualizando...' : 'Actualizar' }}
    </button>
  </div>

  <div *ngIf="error" class="message error">{{ error }}</div>

  <div class="tabla-wrapper" *ngIf="documentosFiltrados.length > 0; else emptyState">
    <table class="tabla-documentos">
      <thead>
        <tr>
          <th>Titulo</th>
          <th>Autor</th>
          <th>Tipo</th>
          <th>Facultad</th>
          <th>Estado</th>
          <th>Descarga</th>
          <th class="text-center">Accion</th>
        </tr>
      </thead>

      <tbody>
        <tr *ngFor="let doc of documentosFiltrados">
          <td class="titulo-doc">{{ doc.titulo }}</td>
          <td>{{ doc.autor }}</td>
          <td>{{ doc.tipoDocumento }}</td>
          <td>{{ doc.facultad }}</td>
          <td>
            <span class="estado-badge" [ngClass]="getStatusClass(doc.estado)">
              {{ doc.estado }}
            </span>
          </td>
          <td>
            <span class="download-badge" [class.download-badge-restricted]="!puedeDescargar(doc)">
              {{ getDownloadStatusLabel(doc) }}
            </span>
          </td>
          <td class="text-center">
            <button class="btn-ver" (click)="abrirVisor(doc)">
              Ver documento
            </button>
          </td>
        </tr>
      </tbody>
    </table>
  </div>
</section>

<ng-template #emptyState>
  <div class="empty-state">
    <strong>No se encontraron documentos.</strong>
    <p>Ajusta el filtro o espera nuevas publicaciones en el repositorio.</p>
  </div>
</ng-template>
