<div class="upload-container">
  <div class="upload-card">
    <div class="upload-header">
      <h2>Subir documento</h2>
      <p>Registra tesis, ensayos, artículos o revistas en el repositorio.</p>
    </div>

    <form (ngSubmit)="guardarDocumento()" #formDocumento="ngForm" class="upload-form">
      <div class="form-grid">
        <div class="form-group">
          <label for="titulo">Título</label>
          <input type="text"
                 id="titulo"
                 name="titulo"
                 [(ngModel)]="titulo"
                 required
                 placeholder="Ej. Sistema de gestión documental universitario" />
        </div>

        <div class="form-group">
          <label for="autor">Autor</label>
          <input type="text"
                 id="autor"
                 name="autor"
                 [(ngModel)]="autor"
                 required
                 placeholder="Ej. Daniel Sanchez" />
        </div>

        <div class="form-group">
          <label for="tipo">Tipo</label>
          <select id="tipo" name="tipo" [(ngModel)]="tipo" required>
            <option value="">Seleccione</option>
            <option value="Tesis">Tesis</option>
            <option value="Ensayo">Ensayo</option>
            <option value="Artículo">Artículo</option>
            <option value="Revista">Revista</option>
            <option value="Investigación">Investigación</option>
          </select>
        </div>

        <div class="form-group">
          <label for="categoria">Categoría</label>
          <input type="text"
                 id="categoria"
                 name="categoria"
                 [(ngModel)]="categoria"
                 required
                 placeholder="Ej. Ingeniería de Sistemas" />
        </div>

        <div class="form-group form-group-full">
          <label for="archivo">Archivo</label>
          <input type="file"
                 id="archivo"
                 accept="application/pdf,application/vnd.openxmlformats-officedocument.wordprocessingml.document"
                 (change)="seleccionarArchivo($event)"
                 required />
        </div>
      </div>

      <div class="acciones">
        <button type="submit" class="btn-subir" [disabled]="cargando">
          {{ cargando ? 'Subiendo...' : 'Guardar documento' }}
        </button>
      </div>

      <div *ngIf="mensaje" class="mensaje-exito">
        {{ mensaje }}
      </div>

      <div *ngIf="error" class="mensaje-error">
        {{ error }}
      </div>
    </form>
  </div>
</div>
