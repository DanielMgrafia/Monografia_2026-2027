<div class="upload-container">
  <div class="upload-card">
    <div class="upload-header">
      <h2>Subir documento</h2>
      <p>Registra documentos usando los catalogos oficiales del sistema.</p>
    </div>

    <form (ngSubmit)="guardarDocumento()" #formDocumento="ngForm" class="upload-form">
      <div class="form-grid">
        <div class="form-group">
          <label for="titulo">Titulo</label>
          <input type="text"
                 id="titulo"
                 name="titulo"
                 [(ngModel)]="titulo"
                 required
                 placeholder="Ej. Sistema de gestion documental universitario" />
        </div>

        <div class="form-group">
          <label for="autor">Autor</label>
          <input type="text"
                 id="autor"
                 name="autor"
                 [(ngModel)]="autor"
                 required
                 placeholder="Ej. Daniel Sanchez" />
        </div>

        <div class="form-group">
          <label for="tipoDocumentoId">Tipo de documento</label>
          <select id="tipoDocumentoId"
                  name="tipoDocumentoId"
                  [(ngModel)]="tipoDocumentoId"
                  [disabled]="cargandoCatalogos || tiposDocumento.length === 0"
                  required>
            <option [ngValue]="null">Seleccione</option>
            <option *ngFor="let tipoDocumento of tiposDocumento" [ngValue]="tipoDocumento.id">
              {{ tipoDocumento.descripcion }}
            </option>
          </select>
        </div>

        <div class="form-group">
          <label for="facultadId">Facultad</label>
          <select id="facultadId"
                  name="facultadId"
                  [(ngModel)]="facultadId"
                  [disabled]="cargandoCatalogos || facultades.length === 0"
                  required>
            <option [ngValue]="null">Seleccione</option>
            <option *ngFor="let facultad of facultades" [ngValue]="facultad.id">
              {{ facultad.descripcion }}
            </option>
          </select>
        </div>

        <div class="form-group form-group-full">
          <label for="archivo">Archivo (PDF o Word)</label>
          <input type="file"
                 #archivoInput
                 id="archivo"
                 accept="application/pdf,application/vnd.openxmlformats-officedocument.wordprocessingml.document"
                 (change)="seleccionarArchivo($event)"
                 required />
        </div>

        <div class="form-group form-group-full">
          <label class="download-policy-card" for="sePuedeDescargar">
            <input type="checkbox"
                   id="sePuedeDescargar"
                   name="sePuedeDescargar"
                   [(ngModel)]="sePuedeDescargar" />
            <span>
              <strong>Permitir descarga del documento</strong>
              <small>
                Si desactivas esta opcion, el archivo se podra visualizar en el sistema,
                pero el boton de descarga quedara bloqueado para todos los roles.
              </small>
            </span>
          </label>
        </div>
      </div>

      <div class="acciones">
        <button type="submit"
                class="btn-subir"
                [disabled]="cargando || cargandoCatalogos || tiposDocumento.length === 0 || facultades.length === 0">
          {{ cargando ? 'Subiendo...' : 'Guardar documento' }}
        </button>
      </div>

      <p *ngIf="cargandoCatalogos && !error">Cargando catalogos...</p>

      <p *ngIf="!cargandoCatalogos && tiposDocumento.length === 0">
        No hay tipos de documento disponibles.
      </p>

      <p *ngIf="!cargandoCatalogos && facultades.length === 0">
        No hay facultades disponibles.
      </p>

      <div *ngIf="mensaje" class="mensaje-exito">
        {{ mensaje }}
      </div>

      <div *ngIf="error" class="mensaje-error">
        {{ error }}
      </div>
    </form>
  </div>
</div>
